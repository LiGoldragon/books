<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 548" role="img"><title>a Memory source is authorized by MemoryBootstrapAuthority a sealed assembly is lowered by lower_memory WholeLogos is emitted by RustLogos an ArtifactSet carries for each table a tuple alias only</title><style>:root{--ink:#1F2933;--grey:#6B7280;--blue:#2563EB;--red:#C2410C;--amber:#B45309;--purple:#7C3AED}
@media (prefers-color-scheme: dark){:root{--ink:#E5E7EB;--grey:#9CA3AF;--blue:#60A5FA;--red:#FB923C;--amber:#FBBF24;--purple:#A78BFA}}
text{font-family:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;fill:var(--ink);text-anchor:middle}
.v{font-size:14px;font-style:italic}.vl{text-anchor:start}.b{font-size:16px;font-weight:700}
.box{fill:none;stroke:var(--ink);stroke-width:1.25}
.qbox{fill:var(--amber);fill-opacity:0.1;stroke:var(--amber);stroke-width:1.25}
.qm{font-size:26px;font-weight:700;fill:var(--amber)}
.arr{stroke:var(--ink);stroke-width:3;fill:none}
.ah{fill:var(--ink)}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="box" x="40" y="20" width="280" height="44"/><text class="b" x="180" y="47">a Memory source</text><line class="arr" x1="60" y1="64" x2="60" y2="144" marker-end="url(#ah)"/><text class="v vl" x="76" y="97">is authorized by</text><text class="v vl" x="76" y="117">MemoryBootstrapAuthority</text><rect class="box" x="40" y="144" width="280" height="44"/><text class="b" x="180" y="171">a sealed assembly</text><line class="arr" x1="60" y1="188" x2="60" y2="268" marker-end="url(#ah)"/><text class="v vl" x="76" y="221">is lowered by</text><text class="v vl" x="76" y="241">lower_memory</text><rect class="box" x="40" y="268" width="280" height="44"/><text class="b" x="180" y="295">WholeLogos</text><line class="arr" x1="60" y1="312" x2="60" y2="376" marker-end="url(#ah)"/><text class="v vl" x="76" y="348">is emitted by RustLogos</text><rect class="box" x="40" y="376" width="280" height="44"/><text class="b" x="180" y="403">an ArtifactSet</text><line class="arr" x1="60" y1="420" x2="60" y2="484" marker-end="url(#ah)"/><text class="v vl" x="76" y="456">carries for each table</text><rect class="box" x="40" y="484" width="280" height="44"/><text class="b" x="180" y="511">a tuple alias only</text></svg>
