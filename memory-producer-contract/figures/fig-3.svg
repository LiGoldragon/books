<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 412" role="img"><title>the runtime identity mapping, not yet ruled</title><style>:root{--ink:#1F2933;--grey:#6B7280;--blue:#2563EB;--red:#C2410C;--amber:#B45309;--purple:#7C3AED}
@media (prefers-color-scheme: dark){:root{--ink:#E5E7EB;--grey:#9CA3AF;--blue:#60A5FA;--red:#FB923C;--amber:#FBBF24;--purple:#A78BFA}}
text{font-family:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;fill:var(--ink);text-anchor:middle}
.v{font-size:14px;font-style:italic}.vl{text-anchor:start}.b{font-size:16px;font-weight:700}
.box{fill:none;stroke:var(--ink);stroke-width:1.25}
.qbox{fill:var(--amber);fill-opacity:0.1;stroke:var(--amber);stroke-width:1.25}
.qm{font-size:26px;font-weight:700;fill:var(--amber)}
.arr{stroke:var(--ink);stroke-width:3;fill:none}
.ah{fill:var(--ink)}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="box" x="8" y="20" width="112" height="84"/><text class="b" x="64" y="59">encoded</text><text class="b" x="64" y="79">name</text><rect class="box" x="144" y="20" width="112" height="84"/><text class="b" x="200" y="49">record and</text><text class="b" x="200" y="69">key storage</text><text class="b" x="200" y="89">fingerprints</text><rect class="box" x="280" y="20" width="112" height="84"/><text class="b" x="336" y="59">current</text><text class="b" x="336" y="79">spelling</text><line class="arr" x1="64" y1="104" x2="64" y2="190" marker-end="url(#ah)"/><line class="arr" x1="200" y1="104" x2="200" y2="190" marker-end="url(#ah)"/><line class="arr" x1="336" y1="104" x2="336" y2="190" marker-end="url(#ah)"/><text class="v vl" x="74" y="152">feeds</text><text class="v vl" x="210" y="152">feeds</text><text class="v vl" x="346" y="152">feeds</text><rect class="qbox" x="8" y="190" width="384" height="70"/><text class="qm" x="34" y="234">?</text><text class="b" x="204" y="221">the runtime identity mapping,</text><text class="b" x="204" y="243">not yet ruled</text><line class="arr" x1="64" y1="260" x2="64" y2="346" marker-end="url(#ah)"/><line class="arr" x1="200" y1="260" x2="200" y2="346" marker-end="url(#ah)"/><line class="arr" x1="336" y1="260" x2="336" y2="346" marker-end="url(#ah)"/><text class="v vl" x="74" y="308">yields</text><text class="v vl" x="210" y="308">yields</text><text class="v vl" x="346" y="308">yields</text><rect class="box" x="8" y="346" width="112" height="46"/><text class="b" x="64" y="374">FamilyName</text><rect class="box" x="144" y="346" width="112" height="46"/><text class="b" x="200" y="374">SchemaHash</text><rect class="box" x="280" y="346" width="112" height="46"/><text class="b" x="336" y="374">TableName</text></svg>
