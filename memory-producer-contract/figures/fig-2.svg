<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 494" role="img"><title>a record to store, an assertion, the table</title><style>:root{--ink:#1F2933;--grey:#6B7280;--blue:#2563EB;--red:#C2410C;--amber:#B45309;--purple:#7C3AED}
@media (prefers-color-scheme: dark){:root{--ink:#E5E7EB;--grey:#9CA3AF;--blue:#60A5FA;--red:#FB923C;--amber:#FBBF24;--purple:#A78BFA}}
text{font-family:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;fill:var(--ink);text-anchor:middle}
.v{font-size:14px;font-style:italic}.vl{text-anchor:start}.b{font-size:16px;font-weight:700}
.box{fill:none;stroke:var(--ink);stroke-width:1.25}
.qbox{fill:var(--amber);fill-opacity:0.1;stroke:var(--amber);stroke-width:1.25}
.qm{font-size:26px;font-weight:700;fill:var(--amber)}
.arr{stroke:var(--ink);stroke-width:3;fill:none}
.ah{fill:var(--ink)}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="box" x="20" y="20" width="320" height="44"/><text class="b" x="180" y="47">a record to store</text><line class="arr" x1="90" y1="64" x2="90" y2="150" marker-end="url(#ah)"/><line class="arr" x1="270" y1="64" x2="270" y2="150" marker-end="url(#ah)"/><text class="v vl" x="102" y="102">is paired with</text><text class="v vl" x="102" y="120">a supplied key</text><text class="v vl" x="282" y="102">has its key</text><text class="v vl" x="282" y="120">extracted</text><rect class="box" x="20" y="150" width="140" height="80"/><text class="b" x="90" y="178">a key and a</text><text class="b" x="90" y="198">record, two</text><text class="b" x="90" y="218">inputs</text><rect class="box" x="200" y="150" width="140" height="80"/><text class="b" x="270" y="178">a record</text><text class="b" x="270" y="198">whose key is</text><text class="b" x="270" y="218">its own</text><line class="arr" x1="90" y1="230" x2="90" y2="310" marker-end="url(#ah)"/><line class="arr" x1="270" y1="230" x2="270" y2="310" marker-end="url(#ah)"/><text class="v vl" x="102" y="275">builds</text><text class="v vl" x="282" y="275">builds</text><rect class="box" x="20" y="310" width="320" height="44"/><text class="b" x="180" y="337">an assertion</text><line class="arr" x1="180" y1="354" x2="180" y2="430" marker-end="url(#ah)"/><text class="v vl" x="194" y="396">stores a record in</text><rect class="box" x="20" y="430" width="320" height="44"/><text class="b" x="180" y="457">the table</text></svg>
