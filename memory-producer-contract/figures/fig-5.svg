<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 328" role="img"><title>canonical source is hashed into source digest is embedded in generated Rust</title><desc>external type paths, external storage provenance, emitter settings shapes generated Rust</desc><style>:root{--ink:#1F2933;--grey:#6B7280;--blue:#2563EB;--red:#C2410C;--amber:#B45309;--purple:#7C3AED}
@media (prefers-color-scheme: dark){:root{--ink:#E5E7EB;--grey:#9CA3AF;--blue:#60A5FA;--red:#FB923C;--amber:#FBBF24;--purple:#A78BFA}}
text{font-family:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;fill:var(--ink);text-anchor:middle}
.v{font-size:14px;font-style:italic}.vl{text-anchor:start}.b{font-size:16px;font-weight:700}
.box{fill:none;stroke:var(--ink);stroke-width:1.25}
.qbox{fill:var(--amber);fill-opacity:0.1;stroke:var(--amber);stroke-width:1.25}
.qm{font-size:26px;font-weight:700;fill:var(--amber)}
.arr{stroke:var(--ink);stroke-width:3;fill:none}
.ah{fill:var(--ink)}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="box" x="12" y="20" width="148" height="44"/><text class="b" x="86" y="48">canonical source</text><rect class="box" x="190" y="20" width="198" height="100"/><text class="b" x="289" y="45">external type</text><text class="b" x="289" y="65">paths, external</text><text class="b" x="289" y="85">storage provenance,</text><text class="b" x="289" y="105">emitter settings</text><rect class="box" x="12" y="136" width="148" height="44"/><text class="b" x="86" y="164">source digest</text><rect class="box" x="12" y="260" width="376" height="44"/><text class="b" x="200" y="288">generated Rust</text><line class="arr" x1="50" y1="64" x2="50" y2="136" marker-end="url(#ah)"/><text class="v vl" x="60" y="104">is hashed into</text><line class="arr" x1="50" y1="180" x2="50" y2="260" marker-end="url(#ah)"/><text class="v vl" x="60" y="224">is embedded in</text><line class="arr" x1="289" y1="120" x2="289" y2="260" marker-end="url(#ah)"/><text class="v vl" x="299" y="194">shapes</text></svg>
