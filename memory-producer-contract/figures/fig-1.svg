<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 390" role="img"><title>a type declared in an Ethos file</title><desc>in Memory bears the memory trait, in Signal bears the message trait, in Operation bears the operation trait, generated with the type, never written the Rust type and its trait impl</desc><style>:root{--ink:#1F2933;--grey:#6B7280;--blue:#2563EB;--red:#C2410C;--amber:#B45309;--purple:#7C3AED}
@media (prefers-color-scheme: dark){:root{--ink:#E5E7EB;--grey:#9CA3AF;--blue:#60A5FA;--red:#FB923C;--amber:#FBBF24;--purple:#A78BFA}}
text{font-family:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;fill:var(--ink);text-anchor:middle}
.v{font-size:14px;font-style:italic}.vl{text-anchor:start}.b{font-size:16px;font-weight:700}
.box{fill:none;stroke:var(--ink);stroke-width:1.25}
.qbox{fill:var(--amber);fill-opacity:0.1;stroke:var(--amber);stroke-width:1.25}
.qm{font-size:26px;font-weight:700;fill:var(--amber)}
.arr{stroke:var(--ink);stroke-width:3;fill:none}
.ah{fill:var(--ink)}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="box" x="10" y="16" width="360" height="44"/><text class="b" x="190" y="44">a type declared in an Ethos file</text><line class="arr" x1="40" y1="60" x2="40" y2="140" marker-end="url(#ah)"/><line class="arr" x1="168" y1="60" x2="168" y2="140" marker-end="url(#ah)"/><line class="arr" x1="296" y1="60" x2="296" y2="140" marker-end="url(#ah)"/><text class="v vl" x="50" y="104">in Memory</text><text class="v vl" x="178" y="104">in Signal</text><text class="v vl" x="306" y="104">in Operation</text><rect class="box" x="10" y="140" width="104" height="90"/><text class="b" x="62" y="170">bears the</text><text class="b" x="62" y="192">memory</text><text class="b" x="62" y="214">trait</text><rect class="box" x="138" y="140" width="104" height="90"/><text class="b" x="190" y="170">bears the</text><text class="b" x="190" y="192">message</text><text class="b" x="190" y="214">trait</text><rect class="box" x="266" y="140" width="104" height="90"/><text class="b" x="318" y="170">bears the</text><text class="b" x="318" y="192">operation</text><text class="b" x="318" y="214">trait</text><line class="arr" x1="40" y1="230" x2="40" y2="330" marker-end="url(#ah)"/><line class="arr" x1="168" y1="230" x2="168" y2="330" marker-end="url(#ah)"/><line class="arr" x1="296" y1="230" x2="296" y2="330" marker-end="url(#ah)"/><text class="v vl" x="50" y="268">generated with</text><text class="v vl" x="50" y="286">the type,</text><text class="v vl" x="50" y="304">never written</text><rect class="box" x="10" y="330" width="360" height="44"/><text class="b" x="190" y="358">the Rust type and its trait impl</text></svg>
